name: Deployment pipeline

on:
  push:
    branches:
      - main

jobs:
  simple_deployment_pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install root dependencies
        run: npm install

      - name: Install client dependencies
        run: |
          cd client
          npm install

      - name: Install server dependencies
        run: |
          cd server
          npm install

      - name: Lint client
        run: |
          cd client
          npm run lint

      - name: Lint server
        run: |
          cd server
          npm run lint

      - name: Build frontend
        run: |
          cd client
          npm run build

      - name: Run backend tests
        run: |
          cd server
          npm test

      - name: Start backend
        run: |
          cd server
          npm run start:test &

      - name: Start frontend
        run: |
          cd client
          npm run dev &

      - name: Run Playwright tests
        run: npm test